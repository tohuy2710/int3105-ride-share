components:
  schemas:
    ErrorResponse:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - RIDE_NOT_FOUND
                - INVALID_RIDE_STATE
                - RIDE_ALREADY_ACCEPTED
                - ACCEPT_IN_PROGRESS
                - DEPENDENCY_UNAVAILABLE
                - INTERNAL_ERROR
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - MATCHING_NOT_FOUND
                - MATCHING_REQUEST_CONFLICT
                - NOTIFICATION_NOT_FOUND
              type: string
            details:
              items:
                type: string
              type: array
            message:
              type: string
          required:
            - code
            - message
            - details
          type: object
      required:
        - error
      type: object
    Health:
      additionalProperties: false
      properties:
        service:
          enum:
            - auth-service
          type: string
        status:
          enum:
            - ok
          type: string
      required:
        - service
        - status
      type: object
    LoginRequest:
      additionalProperties: true
      properties:
        email:
          format: email
          type: string
        password:
          maxLength: 72
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    LoginResponse:
      additionalProperties: false
      properties:
        accessToken:
          minLength: 1
          type: string
        expiresIn:
          enum:
            - 3600
          type: integer
        tokenType:
          enum:
            - Bearer
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
        - accessToken
        - tokenType
        - expiresIn
        - user
      type: object
    Ready:
      additionalProperties: false
      properties:
        postgres:
          enum:
            - ok
            - unavailable
          type: string
        redis:
          enum:
            - unavailable
          type: string
        status:
          enum:
            - ok
            - degraded
            - unavailable
          type: string
      required:
        - status
      type: object
    RegisterRequest:
      additionalProperties: true
      properties:
        email:
          format: email
          type: string
        password:
          maxLength: 72
          minLength: 8
          type: string
        role:
          enum:
            - RIDER
            - DRIVER
          type: string
      required:
        - email
        - password
        - role
      type: object
    RegisterResponse:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        persisted:
          enum:
            - false
          type: boolean
        role:
          enum:
            - RIDER
            - DRIVER
          type: string
        userId:
          enum:
            - user_mock
          type: string
      required:
        - userId
        - email
        - role
        - persisted
      type: object
    User:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        role:
          enum:
            - RIDER
            - DRIVER
          type: string
        userId:
          minLength: 1
          pattern: \S
          type: string
      required:
        - userId
        - email
        - role
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    internalToken:
      in: header
      name: X-Internal-Token
      type: apiKey
info:
  description: JSON <= 1 MiB. Unknown input fields are ignored. Public routes use JWT; internal routes use X-Internal-Token. Ride, Location, Matching and Notification persist in PostgreSQL; inter-service calls use authenticated HTTP. Notification QUEUED means durably stored, not device delivery. Auth uses fixture credentials; registration and fare estimation remain mock.
  title: Auth Service API
  version: 1.1.0
openapi: 3.0.3
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'VALIDATION_ERROR: malformed or invalid input'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'UNAUTHORIZED: missing, invalid or expired credentials'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security: []
      summary: Authenticate pre-seeded fixture credentials; signed HS256 JWT valid for 3600 seconds
  /auth/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'UNAUTHORIZED: missing, invalid or expired credentials'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security:
        - bearerAuth: []
      summary: Read verified JWT identity
  /auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'VALIDATION_ERROR: malformed or invalid input'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security: []
      summary: 'MOCK: no account persisted, returned identity cannot log in'
  /healthz:
    get:
      operationId: authHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security: []
      summary: Process liveness; does not inspect dependencies
  /readyz:
    get:
      operationId: authReady
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security: []
      summary: Stateless service readiness
servers:
  - url: http://localhost:8085
