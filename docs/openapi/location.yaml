components:
  schemas:
    AvailabilityRequest:
      additionalProperties: true
      properties:
        available:
          type: boolean
      required:
        - available
      type: object
    AvailabilityResponse:
      additionalProperties: false
      properties:
        available:
          type: boolean
        driverId:
          minLength: 1
          pattern: \S
          type: string
      required:
        - driverId
        - available
      type: object
    Coordinates:
      additionalProperties: true
      properties:
        lat:
          format: double
          maximum: 90
          minimum: -90
          type: number
        long:
          format: double
          maximum: 180
          minimum: -180
          type: number
      required:
        - lat
        - long
      type: object
    Driver:
      additionalProperties: false
      properties:
        distanceMeters:
          minimum: 0
          type: integer
        driverId:
          minLength: 1
          pattern: \S
          type: string
        location:
          $ref: '#/components/schemas/Coordinates'
      required:
        - driverId
        - location
        - distanceMeters
      type: object
    ErrorResponse:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - RIDE_NOT_FOUND
                - INVALID_RIDE_STATE
                - RIDE_ALREADY_ACCEPTED
                - ACCEPT_IN_PROGRESS
                - DEPENDENCY_UNAVAILABLE
                - INTERNAL_ERROR
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - MATCHING_NOT_FOUND
                - MATCHING_REQUEST_CONFLICT
                - NOTIFICATION_NOT_FOUND
              type: string
            details:
              items:
                type: string
              type: array
            message:
              type: string
          required:
            - code
            - message
            - details
          type: object
      required:
        - error
      type: object
    Health:
      additionalProperties: false
      properties:
        service:
          enum:
            - location-service
          type: string
        status:
          enum:
            - ok
          type: string
      required:
        - service
        - status
      type: object
    LocationResponse:
      additionalProperties: false
      properties:
        driverId:
          minLength: 1
          pattern: \S
          type: string
        lat:
          maximum: 90
          minimum: -90
          type: number
        long:
          maximum: 180
          minimum: -180
          type: number
      required:
        - driverId
        - lat
        - long
      type: object
    NearbyResponse:
      additionalProperties: false
      properties:
        drivers:
          items:
            $ref: '#/components/schemas/Driver'
          type: array
      required:
        - drivers
      type: object
    Ready:
      additionalProperties: false
      properties:
        postgres:
          enum:
            - ok
            - unavailable
          type: string
        redis:
          enum:
            - unavailable
          type: string
        status:
          enum:
            - ok
            - degraded
            - unavailable
          type: string
      required:
        - status
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    internalToken:
      in: header
      name: X-Internal-Token
      type: apiKey
info:
  description: JSON <= 1 MiB. Unknown input fields are ignored. Public routes use JWT; internal routes use X-Internal-Token. Ride, Location, Matching and Notification persist in PostgreSQL; inter-service calls use authenticated HTTP. Notification QUEUED means durably stored, not device delivery. Auth uses fixture credentials; registration and fare estimation remain mock.
  title: Location Service API
  version: 1.1.0
openapi: 3.0.3
paths:
  /drivers/availability:
    patch:
      operationId: updateAvailability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityResponse'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'VALIDATION_ERROR: malformed or invalid input'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'UNAUTHORIZED: missing, invalid or expired credentials'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'FORBIDDEN: role or ownership denied'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: DEPENDENCY_UNAVAILABLE
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security:
        - bearerAuth: []
      summary: 'DRIVER: persist availability, preserving coordinates'
  /drivers/location:
    post:
      operationId: updateLocation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Coordinates'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationResponse'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'VALIDATION_ERROR: malformed or invalid input'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'UNAUTHORIZED: missing, invalid or expired credentials'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'FORBIDDEN: role or ownership denied'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: DEPENDENCY_UNAVAILABLE
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security:
        - bearerAuth: []
      summary: 'DRIVER: persist latest coordinates, preserving availability'
  /healthz:
    get:
      operationId: locationHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security: []
      summary: Process liveness; does not inspect dependencies
  /internal/drivers/nearby:
    get:
      operationId: nearbyDrivers
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            maximum: 90
            minimum: -90
            type: number
        - in: query
          name: long
          required: true
          schema:
            maximum: 180
            minimum: -180
            type: number
        - in: query
          name: radiusMeters
          required: false
          schema:
            default: 3000
            exclusiveMinimum: true
            minimum: 0
            type: number
      responses:
        "200":
          content:
            application/json:
              example:
                drivers:
                  - distanceMeters: 500
                    driverId: driver_456
                    location:
                      lat: 21.0285
                      long: 105.8542
              schema:
                $ref: '#/components/schemas/NearbyResponse'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'VALIDATION_ERROR: malformed or invalid input'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'UNAUTHORIZED: missing, invalid or expired credentials'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: DEPENDENCY_UNAVAILABLE
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security:
        - internalToken: []
      summary: Find available drivers with recorded coordinates within radius; Haversine distance, nearest first
  /readyz:
    get:
      operationId: locationReady
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
          description: PostgreSQL schema unavailable
      security: []
      summary: Readiness checks required PostgreSQL tables; Ride may report degraded when only Redis fails
servers:
  - url: http://localhost:8082
