name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_USER: ride
          POSTGRES_PASSWORD: ride_local
          POSTGRES_DB: rides
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ride -d rides"
          --health-interval 3s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ride:ride_local@localhost:5432/rides?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache: false
      - run: make fmt-check vet test-race contract build integration
      - run: docker compose --env-file .env.example --profile full config --quiet
      - run: python3 -m compileall -q scripts
