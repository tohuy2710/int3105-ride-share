components:
  schemas:
    ErrorResponse:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - RIDE_NOT_FOUND
                - INVALID_RIDE_STATE
                - RIDE_ALREADY_ACCEPTED
                - ACCEPT_IN_PROGRESS
                - DEPENDENCY_UNAVAILABLE
                - INTERNAL_ERROR
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
              type: string
            details:
              items:
                type: string
              type: array
            message:
              type: string
          required:
            - code
            - message
            - details
          type: object
      required:
        - error
      type: object
    Health:
      additionalProperties: false
      properties:
        service:
          enum:
            - matching-service
          type: string
        status:
          enum:
            - ok
          type: string
      required:
        - service
        - status
      type: object
    MatchingRequest:
      additionalProperties: true
      properties:
        rideId:
          minLength: 1
          pattern: \S
          type: string
      required:
        - rideId
      type: object
    MatchingResponse:
      additionalProperties: false
      properties:
        rideId:
          minLength: 1
          pattern: \S
          type: string
        status:
          enum:
            - MATCHING
          type: string
      required:
        - rideId
        - status
      type: object
    Ready:
      additionalProperties: false
      properties:
        postgres:
          enum:
            - ok
            - unavailable
          type: string
        redis:
          enum:
            - unavailable
          type: string
        status:
          enum:
            - ok
            - degraded
            - unavailable
          type: string
      required:
        - status
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    internalToken:
      in: header
      name: X-Internal-Token
      type: apiKey
info:
  description: Phase 1. JSON <= 1 MiB. Unknown input fields are ignored for compatibility. IDs are nonblank strings. Public routes use JWT; internal routes use X-Internal-Token. Only Ride persists data; Auth uses fixtures. No inter-service HTTP or AMQP wiring.
  title: Matching Service API
  version: 1.0.0
openapi: 3.0.3
paths:
  /healthz:
    get:
      operationId: matchingHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security: []
      summary: Process liveness; does not inspect dependencies
  /internal/matching/requests:
    post:
      operationId: requestMatching
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchingRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              example:
                rideId: ride_123
                status: MATCHING
              schema:
                $ref: '#/components/schemas/MatchingResponse'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'VALIDATION_ERROR: malformed or invalid input'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'UNAUTHORIZED: missing, invalid or expired credentials'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security:
        - internalToken: []
      summary: 'Ride -> Matching: fixture acknowledgement only; no worker or queue'
  /internal/matching/requests/{rideId}:
    get:
      operationId: getMatching
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingResponse'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'VALIDATION_ERROR: malformed or invalid input'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'UNAUTHORIZED: missing, invalid or expired credentials'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security:
        - internalToken: []
      summary: Always MATCHING; independent from persisted Ride state
    parameters:
      - in: path
        name: rideId
        required: true
        schema:
          minLength: 1
          pattern: \S
          type: string
  /readyz:
    get:
      operationId: matchingReady
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security: []
      summary: Stateless service readiness
servers:
  - url: http://localhost:8083
