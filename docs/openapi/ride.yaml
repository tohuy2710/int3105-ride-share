components:
  schemas:
    ActionRequest:
      additionalProperties: true
      properties:
        action:
          enum:
            - ACCEPT
            - DENY
          type: string
      required:
        - action
      type: object
    ActionResponse:
      additionalProperties: false
      properties:
        action:
          enum:
            - ACCEPT
            - DENY
          type: string
        driverId:
          minLength: 1
          nullable: true
          pattern: \S
          type: string
        rideId:
          minLength: 1
          pattern: \S
          type: string
        status:
          enum:
            - REQUESTED
            - ACCEPTED
            - ARRIVED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
          type: string
      required:
        - rideId
        - action
        - driverId
        - status
      type: object
    Coordinates:
      additionalProperties: true
      properties:
        lat:
          format: double
          maximum: 90
          minimum: -90
          type: number
        long:
          format: double
          maximum: 180
          minimum: -180
          type: number
      required:
        - lat
        - long
      type: object
    CreateRequest:
      additionalProperties: true
      properties:
        fareId:
          minLength: 1
          pattern: \S
          type: string
        pickupLocation:
          $ref: '#/components/schemas/Coordinates'
        radiusMeters:
          default: 3000
          description: Positive search radius in meters; null is invalid
          exclusiveMinimum: true
          minimum: 0
          type: number
      required:
        - fareId
        - pickupLocation
      type: object
    DetailsResponse:
      additionalProperties: false
      properties:
        driverId:
          minLength: 1
          nullable: true
          pattern: \S
          type: string
        fareId:
          minLength: 1
          pattern: \S
          type: string
        rideId:
          minLength: 1
          pattern: \S
          type: string
        riderId:
          minLength: 1
          pattern: \S
          type: string
        status:
          enum:
            - REQUESTED
            - ACCEPTED
            - ARRIVED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
          type: string
      required:
        - rideId
        - fareId
        - riderId
        - driverId
        - status
      type: object
    ErrorResponse:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - RIDE_NOT_FOUND
                - INVALID_RIDE_STATE
                - RIDE_ALREADY_ACCEPTED
                - ACCEPT_IN_PROGRESS
                - DEPENDENCY_UNAVAILABLE
                - INTERNAL_ERROR
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - MATCHING_NOT_FOUND
                - MATCHING_REQUEST_CONFLICT
                - NOTIFICATION_NOT_FOUND
              type: string
            details:
              items:
                type: string
              type: array
            message:
              type: string
          required:
            - code
            - message
            - details
          type: object
      required:
        - error
      type: object
    FareRequest:
      additionalProperties: true
      properties:
        destination:
          $ref: '#/components/schemas/Coordinates'
        pickupLocation:
          $ref: '#/components/schemas/Coordinates'
      required:
        - pickupLocation
        - destination
      type: object
    FareResponse:
      additionalProperties: false
      properties:
        estimatedFare:
          enum:
            - 85000
          type: integer
        etaMinutes:
          enum:
            - 12
          type: integer
        fareId:
          minLength: 1
          pattern: \S
          type: string
      required:
        - fareId
        - estimatedFare
        - etaMinutes
      type: object
    Health:
      additionalProperties: false
      properties:
        service:
          enum:
            - ride-service
          type: string
        status:
          enum:
            - ok
          type: string
      required:
        - service
        - status
      type: object
    Metrics:
      additionalProperties: false
      properties:
        redisFallback:
          minimum: 0
          type: integer
        redisRejected:
          minimum: 0
          type: integer
        sqlAttempts:
          minimum: 0
          type: integer
      required:
        - sqlAttempts
        - redisRejected
        - redisFallback
      type: object
    Ready:
      additionalProperties: false
      properties:
        postgres:
          enum:
            - ok
            - unavailable
          type: string
        redis:
          enum:
            - unavailable
          type: string
        status:
          enum:
            - ok
            - degraded
            - unavailable
          type: string
      required:
        - status
      type: object
    RideResponse:
      additionalProperties: false
      properties:
        rideId:
          minLength: 1
          pattern: \S
          type: string
        status:
          enum:
            - REQUESTED
            - ACCEPTED
            - ARRIVED
            - IN_PROGRESS
            - COMPLETED
            - CANCELLED
          type: string
      required:
        - rideId
        - status
      type: object
    StatusRequest:
      additionalProperties: true
      properties:
        status:
          enum:
            - ARRIVED
            - IN_PROGRESS
            - COMPLETED
          type: string
      required:
        - status
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    internalToken:
      in: header
      name: X-Internal-Token
      type: apiKey
info:
  description: JSON <= 1 MiB. Unknown input fields are ignored. Public routes use JWT; internal routes use X-Internal-Token. Ride, Location, Matching and Notification persist in PostgreSQL; inter-service calls use authenticated HTTP. Notification QUEUED means durably stored, not device delivery. Auth uses fixture credentials; registration and fare estimation remain mock.
  title: Ride Service API
  version: 1.1.0
openapi: 3.0.3
paths:
  /fare:
    post:
      operationId: estimateFare
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FareRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                estimatedFare: 85000
                etaMinutes: 12
                fareId: fare_123
              schema:
                $ref: '#/components/schemas/FareResponse'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'VALIDATION_ERROR: malformed or invalid input'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'UNAUTHORIZED: missing, invalid or expired credentials'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'FORBIDDEN: role or ownership denied'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: DEPENDENCY_UNAVAILABLE
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security:
        - bearerAuth: []
      summary: 'RIDER: fixed fare fixture'
  /healthz:
