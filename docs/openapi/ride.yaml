            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: DEPENDENCY_UNAVAILABLE
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security:
        - bearerAuth: []
