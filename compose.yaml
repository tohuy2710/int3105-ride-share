services:
  ride:
    build:
      context: .
      args:
        SERVICE: ride
    ports:
      - "${RIDE_PORT:-8081}:8081"
    environment:
      PORT: "8081"
      GIN_MODE: ${GIN_MODE:-release}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
  location:
    build:
      context: .
      args:
        SERVICE: location
    ports:
      - "${LOCATION_PORT:-8082}:8082"
    environment:
