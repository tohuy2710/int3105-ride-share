components:
  schemas:
    Coordinates:
      additionalProperties: true
      properties:
        lat:
          format: double
          maximum: 90
          minimum: -90
          type: number
        long:
          format: double
          maximum: 180
          minimum: -180
          type: number
      required:
        - lat
        - long
      type: object
    ErrorResponse:
      additionalProperties: false
      properties:
        error:
          additionalProperties: false
          properties:
            code:
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - RIDE_NOT_FOUND
                - INVALID_RIDE_STATE
                - RIDE_ALREADY_ACCEPTED
                - ACCEPT_IN_PROGRESS
                - DEPENDENCY_UNAVAILABLE
                - INTERNAL_ERROR
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - MATCHING_NOT_FOUND
                - MATCHING_REQUEST_CONFLICT
                - NOTIFICATION_NOT_FOUND
              type: string
            details:
              items:
                type: string
              type: array
            message:
              type: string
          required:
            - code
            - message
            - details
          type: object
      required:
        - error
      type: object
    Health:
      additionalProperties: false
      properties:
        service:
          enum:
            - matching-service
          type: string
        status:
          enum:
            - ok
          type: string
      required:
        - service
        - status
      type: object
    MatchingRequest:
      additionalProperties: true
      properties:
        pickupLocation:
          $ref: '#/components/schemas/Coordinates'
        radiusMeters:
          default: 3000
          description: Positive search radius in meters; null is invalid
          exclusiveMinimum: true
          minimum: 0
          type: number
        rideId:
          minLength: 1
          pattern: \S
          type: string
      required:
        - rideId
        - pickupLocation
      type: object
    MatchingResponse:
      additionalProperties: false
      properties:
        rideId:
          minLength: 1
          pattern: \S
          type: string
        status:
          enum:
            - MATCHING
            - NO_DRIVERS
            - MATCHED
            - CANCELLED
          type: string
      required:
        - rideId
        - status
      type: object
    Ready:
      additionalProperties: false
      properties:
        postgres:
          enum:
            - ok
            - unavailable
          type: string
        redis:
          enum:
            - unavailable
          type: string
        status:
          enum:
            - ok
            - degraded
            - unavailable
          type: string
      required:
        - status
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    internalToken:
      in: header
      name: X-Internal-Token
      type: apiKey
info:
  description: JSON <= 1 MiB. Unknown input fields are ignored. Public routes use JWT; internal routes use X-Internal-Token. Ride, Location, Matching and Notification persist in PostgreSQL; inter-service calls use authenticated HTTP. Notification QUEUED means durably stored, not device delivery. Auth uses fixture credentials; registration and fare estimation remain mock.
  title: Matching Service API
  version: 1.1.0
openapi: 3.0.3
paths:
  /healthz:
    get:
      operationId: matchingHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security: []
      summary: Process liveness; does not inspect dependencies
  /internal/matching/requests:
    post:
      operationId: requestMatching
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchingRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              example:
                rideId: ride_123
                status: MATCHING
              schema:
                $ref: '#/components/schemas/MatchingResponse'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'VALIDATION_ERROR: malformed or invalid input'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'UNAUTHORIZED: missing, invalid or expired credentials'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: RIDE_NOT_FOUND
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: MATCHING_REQUEST_CONFLICT or INVALID_RIDE_STATE
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: DEPENDENCY_UNAVAILABLE
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security:
        - internalToken: []
      summary: Persist matching job; find nearby available drivers and durably queue one notification per candidate
  /internal/matching/requests/{rideId}:
    get:
      operationId: getMatching
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchingResponse'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'VALIDATION_ERROR: malformed or invalid input'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: 'UNAUTHORIZED: missing, invalid or expired credentials'
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: MATCHING_NOT_FOUND or RIDE_NOT_FOUND
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: DEPENDENCY_UNAVAILABLE
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
      security:
        - internalToken: []
      summary: Read matching job and reconcile status with Ride; terminal matching statuses never regress
    parameters:
      - in: path
        name: rideId
        required: true
        schema:
          minLength: 1
          pattern: \S
          type: string
  /readyz:
    get:
      operationId: matchingReady
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
          description: Success
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: INTERNAL_ERROR
          headers:
            X-Request-ID:
              description: Echo request ID up to 128 characters, otherwise generate a new ID
              schema:
                type: string
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ready'
          description: PostgreSQL schema unavailable
      security: []
      summary: Readiness checks required PostgreSQL tables; Ride may report degraded when only Redis fails
servers:
  - url: http://localhost:8083
