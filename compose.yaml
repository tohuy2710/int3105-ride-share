    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
  notification:
    build:
      context: .
      args:
        SERVICE: notification
    ports:
      - "${NOTIFICATION_PORT:-8084}:8084"
    environment:
      PORT: "8084"
      GIN_MODE: ${GIN_MODE:-release}
